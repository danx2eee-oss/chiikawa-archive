<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff9f0"><title>치이카와 아카이브</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#29313b;background:#fff9f0}*{box-sizing:border-box}body{margin:0}main{max-width:800px;margin:auto;padding:20px 14px 80px}header{display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-size:1.65rem;margin:14px 0 5px}.muted{color:#65717d;font-size:.89rem}.panel,.post{background:#fff;border:1px solid #eadfce;border-radius:16px;padding:15px;margin:12px 0;box-shadow:0 2px 8px #3d2c1210}.controls{display:flex;gap:8px;flex-wrap:wrap}input,select,button,a.action{font:inherit;border:1px solid #ddd1c1;background:#fff;border-radius:10px;padding:10px;color:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #6b93dc}.primary{background:#ffe7a8}a{color:#235ba0}.post-head{display:flex;justify-content:space-between;align-items:center;gap:8px}.star{font-size:1.4rem;min-width:48px}.post p{white-space:pre-wrap;overflow-wrap:anywhere}.post .media{width:100%;height:auto;border-radius:12px;margin-top:8px}.embed{min-height:50px}.empty{text-align:center;padding:28px;color:#687381}.hidden{display:none!important}#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#29313b;color:white;border-radius:10px;padding:12px;display:none;max-width:90vw}#top{position:fixed;bottom:15px;right:15px}</style></head><body><main><header><div><h1>🌼 치이카와 아카이브</h1><div class="muted">@ngnchiikawa · 오래된 게시글부터</div></div><a href="admin.html" class="action" style="font-size:.8rem">관리자 도구</a></header><section class="panel"><div class="controls"><input id="search" placeholder="본문 또는 게시글 번호 검색" aria-label="검색" style="flex:1;min-width:170px"><select id="filter" aria-label="게시글 필터"><option value="all">모든 게시글</option><option value="images">이미지 첨부</option><option value="imageOnly">본문 없는 이미지</option><option value="saved">내 책갈피</option></select><select id="order" aria-label="정렬"><option value="old">오래된 순</option><option value="new">최신 순</option></select><select id="year" aria-label="연도"><option value="">전체 연도</option></select></div><p class="muted" id="status">게시글을 불러오는 중…</p><div class="controls"><button id="resume">📍 읽던 위치로</button><button id="backup">☆ 책갈피 백업</button><label class="action" style="cursor:pointer">책갈피 복원 <input type="file" id="restore" accept="application/json" style="display:none"></label></div></section><div id="feed" aria-live="polite"></div><button id="more" class="primary hidden" style="width:100%">30개 더 보기</button></main><button id="top" aria-label="맨 위로">↑</button><div id="toast" role="status"></div><script src="https://platform.twitter.com/widgets.js" async charset="utf-8"></script><script>
'use strict';const $=id=>document.getElementById(id),KEY='chiikawa_shared_v1';let posts=[],shown=30;let state={bookmarks:[],last:null};try{state={...state,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{}const persist=()=>localStorage.setItem(KEY,JSON.stringify(state));const toast=t=>{const e=$('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2700)};const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n};function filtered(){const q=$('search').value.toLowerCase(),f=$('filter').value,y=$('year').value;return posts.filter(p=>(!y||p.created_at.slice(0,4)===y)&&(!q||p.id.includes(q)||(p.text||'').toLowerCase().includes(q))&&(f!=='images'||p.images.length>0)&&(f!=='imageOnly'||p.images.length>0&&!(p.text||'').trim())&&(f!=='saved'||state.bookmarks.includes(p.id))).sort((a,b)=>$('order').value==='old'?a.created_at.localeCompare(b.created_at)||a.id.localeCompare(b.id):b.created_at.localeCompare(a.created_at)||b.id.localeCompare(a.id))}function draw(){const list=filtered();$('status').textContent=`공유 게시글 ${posts.length}개 · 검색 결과 ${list.length}개 · 표시 ${Math.min(shown,list.length)}개`;const feed=$('feed');feed.replaceChildren();if(!list.length)feed.append(el('div','empty','등록된 게시글이 없거나 검색 결과가 없어.'));for(const p of list.slice(0,shown)){const card=el('article','post');card.id='post-'+p.id;const head=el('div','post-head');const date=el('span','muted',new Date(p.created_at).toLocaleDateString('ko-KR',{timeZone:'Asia/Seoul'}));const star=el('button','star',state.bookmarks.includes(p.id)?'★':'☆');star.setAttribute('aria-label','책갈피 토글');star.onclick=()=>{state.bookmarks=state.bookmarks.includes(p.id)?state.bookmarks.filter(x=>x!==p.id):[...state.bookmarks,p.id];persist();draw();toast('책갈피를 저장했어')};head.append(date,star);card.append(head);if(p.text)card.append(el('p','',p.text));if(p.images.length){for(const url of p.images){const a=el('a');a.href=url;a.target='_blank';a.rel='noopener noreferrer';const im=el('img','media');im.src=url;im.loading='lazy';im.alt='게시글 이미지';a.append(im);card.append(a)}}else{const b=el('blockquote','twitter-tweet');const a=el('a','', 'X 게시글 열기');a.href=p.url;b.append(a);card.append(b)}const a=el('a','','원본 게시글 보기 ↗');a.href=p.url;a.target='_blank';a.rel='noopener noreferrer';card.append(el('p'));
card.lastElementChild.append(a);const mark=el('button','','여기까지 읽었어');mark.onclick=()=>{state.last=p.id;persist();toast('읽던 위치를 저장했어')};card.append(mark);feed.append(card)}$('more').classList.toggle('hidden',shown>=list.length);if(window.twttr?.widgets)window.twttr.widgets.load(feed)}for(const id of ['search','filter','order','year'])$(id).addEventListener('input',()=>{shown=30;draw()});$('more').onclick=()=>{shown+=30;draw()};$('top').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});$('resume').onclick=()=>{if(!state.last)return toast('아직 저장된 읽던 위치가 없어');$('filter').value='all';$('search').value='';$('year').value='';let index=filtered().findIndex(p=>p.id===state.last);if(index<0)return toast('해당 게시글이 현재 목록에 없어');shown=Math.max(shown,index+1);draw();requestAnimationFrame(()=>$('post-'+state.last)?.scrollIntoView({behavior:'smooth'}))};$('backup').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const u=URL.createObjectURL(blob);const a=el('a');a.href=u;a.download='chiikawa-bookmarks.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),500)};$('restore').onchange=async e=>{try{const v=JSON.parse(await e.target.files[0].text());if(!Array.isArray(v.bookmarks))throw Error();state.bookmarks=v.bookmarks.filter(x=>/^\d{10,22}$/.test(x));state.last=typeof v.last==='string'?v.last:null;persist();draw();toast('책갈피 복원 완료')}catch{toast('올바른 책갈피 JSON이 아니야')}};fetch('./data/posts.json?'+Date.now()).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(v=>{if(!Array.isArray(v))throw Error('JSON 배열 필요');posts=v.filter(p=>p&&/^\d{10,22}$/.test(String(p.id))&&typeof p.created_at==='string'&&/^https:\/\/x\.com\/ngnchiikawa\/status\/\d+$/.test(p.url)).map(p=>({...p,id:String(p.id),images:Array.isArray(p.images)?p.images.filter(x=>typeof x==='string'&&x.startsWith('https://')):[],text:String(p.text||'')}));for(const y of [...new Set(posts.map(p=>p.created_at.slice(0,4)))].sort()){const o=el('option','',y);o.value=y;$('year').append(o)}draw()}).catch(e=>$('status').textContent='데이터를 불러오지 못했어: '+e.message);
</script></body></html>
